# Continuous verification of the agent itself and of the template game.
# Everything here runs without model API keys, model servers, Cloudflare or Kaggle credentials:
# the tests are stdlib-only (fake model servers, fake Cloudflare transport, generated test keys)
# and the engine job uses the pinned Godot binary. Nothing is deployed from CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (stdlib unittest, no network, engine-dependent tests skip)
        run: python3 -m unittest discover -s tests -v
      - name: Byte-compile package, training, helper scripts and tests
        run: python3 -m compileall -q godotai training scripts tests
      - name: Secret scan of the checked-in tree (fails on token-shaped strings)
        run: python3 scripts/secret_scan.py .
      - name: Chat page JavaScript parses (no build step, no inline script)
        run: node --check godotai/chat/static/app.js
      - name: Chat UI server smoke test (binds an ephemeral loopback port, prints readiness, exits; no model call)
        run: GODOTAI_SKIP_MODEL_PROBE=1 python3 -m godotai chat --port 0 --games-dir /tmp/ci-games --check
      - name: Chat page JavaScript drives the real server in a DOM (jsdom, scripted model, loopback only — zero JS errors required)
        run: |
          mkdir -p /tmp/ui-deps && (cd /tmp/ui-deps && npm init -y > /dev/null && npm install --no-audit --no-fund jsdom@24)
          GODOTAI_UI_DEPS=/tmp/ui-deps node tests/ui/jsdom_smoke.mjs
      - name: Doctor with the private-model default (no key, no server — must print the honest identity line)
        run: |
          GODOTAI_SKIP_MODEL_PROBE=1 python3 -m godotai doctor > /tmp/doctor.txt || true
          grep -F "identity: godotai — private deployment of an open-weight model" /tmp/doctor.txt
          grep -F "not from scratch" /tmp/doctor.txt
      - name: eval compare with no results → NO EVIDENCE (exit 1 is the documented outcome, nothing else)
        run: |
          mkdir -p /tmp/ci-noresults
          if python3 -m godotai eval compare --results-dir /tmp/ci-noresults > /tmp/compare.txt; then
            echo "expected exit 1 without common results"; exit 1
          fi
          grep -F "NO EVIDENCE" /tmp/compare.txt
      - name: Cloudflare website setup — dry-run only (prints the 4 API calls; no token, no network; synthetic ids)
        run: |
          python3 scripts/cloudflare_setup.py --dry-run --hostname games.example.com --team-domain myteam \
            --emails you@example.com --account-id 0123456789abcdef0123456789abcdef \
            --zone-id fedcba9876543210fedcba9876543210 | tee /tmp/cf-dry-run.txt
          grep -F "DRY RUN" /tmp/cf-dry-run.txt
          grep -F "http_status:404" /tmp/cf-dry-run.txt
      - name: Training pipeline dry-run on a synthetic verified trajectory (no ML deps)
        run: |
          python3 - <<'EOF'
          import json, sys
          sys.path.insert(0, "tests")
          from test_evals_dataset import anthropic_run, openai_run
          from pathlib import Path
          runs = Path("/tmp/ci-runs"); runs.mkdir(exist_ok=True)
          (runs / "a.json").write_text(json.dumps(anthropic_run()))
          (runs / "b.json").write_text(json.dumps(openai_run()))
          EOF
          python3 -m godotai dataset extract --runs /tmp/ci-runs --out /tmp/ci-sft.jsonl
          python3 training/train_qlora.py --data /tmp/ci-sft.jsonl --dry-run --min-iterations 0
          python3 scripts/kaggle_push.py --check   # offline: renders kernel metadata, no credentials

  godot-verify-template:
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Godot editor (checksums pinned in repo)
        run: python3 -m godotai install-godot --editor-only --bin-dir "$HOME/.local/bin"
      - name: Doctor
        run: PATH="$HOME/.local/bin:$PATH" python3 -m godotai doctor || true
      - name: Build the ClassDB API index from the real engine and spot-check it
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python3 -m godotai apiref build --force
          python3 -m godotai apiref lookup CharacterBody2D move_and_slide
          python3 -m godotai apiref lookup Node queue_free
      - name: Scaffold a game from the template and verify it with the real engine
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python3 -m godotai new --template mobile-2d --dest /tmp/game --name "CI Game" --package com.example.cigame
          python3 -m godotai verify --project /tmp/game --json /tmp/verify.json
      - name: Full unit-test suite with the real engine (includes the tests skipped without a binary)
        run: PATH="$HOME/.local/bin:$PATH" python3 -m unittest discover -s tests
      - name: Score the template against the baseline eval task (engine-backed, no LLM)
        run: PATH="$HOME/.local/bin:$PATH" python3 -m godotai eval score --task template-baseline --project /tmp/game
      - uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: /tmp/verify.json
