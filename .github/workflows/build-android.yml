# Build Android APK with the pinned Godot version.
#
# Self-contained on purpose: the godotai agent copies this file into every game
# repository it creates (github_push_project) and triggers it (github_build_apk),
# so the game repo does not need the agent package. The env block is kept in sync
# with godot.toml by tests/test_workflow_sync.py.
#
# Requirements follow the official 4.7 "Exporting for Android" docs:
# OpenJDK 17, Build-Tools 35.0.1, Platform 35 (Gradle path also needs NDK r28b + CMake).
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      project_dir:
        description: "Directory containing project.godot (relative to repo root)"
        required: false
        default: templates/mobile-2d
      build_type:
        description: "debug or release (release needs keystore secrets)"
        required: false
        default: debug
        type: choice
        options: [debug, release]
      preset:
        description: "Export preset name from export_presets.cfg"
        required: false
        default: Android

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"
  BUILD_TOOLS: "35.0.1"
  PLATFORM: "android-35"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          MGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$MGR" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            unzip -q /tmp/clt.zip -d /tmp/clt && mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          yes | "$MGR" --sdk_root="$SDK" --licenses > /dev/null || true
          "$MGR" --sdk_root="$SDK" "platform-tools" "build-tools;${BUILD_TOOLS}" "platforms;${PLATFORM}" "cmdline-tools;latest" > /dev/null

      - name: Install Godot ${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }} + export templates (SHA-512 verified)
        run: |
          set -euo pipefail
          TAG="${GODOT_VERSION}-${GODOT_RELEASE}"
          BASE="https://github.com/godotengine/godot-builds/releases/download/${TAG}"
          cd /tmp
          curl -sSL -o SHA512-SUMS.txt "${BASE}/SHA512-SUMS.txt"
          curl -sSL -o "Godot_v${TAG}_linux.x86_64.zip" "${BASE}/Godot_v${TAG}_linux.x86_64.zip"
          curl -sSL -o "Godot_v${TAG}_export_templates.tpz" "${BASE}/Godot_v${TAG}_export_templates.tpz"
          grep -E "Godot_v${TAG}_(linux.x86_64.zip|export_templates.tpz)$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "Godot_v${TAG}_linux.x86_64.zip"
          sudo mv "Godot_v${TAG}_linux.x86_64" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          unzip -q "Godot_v${TAG}_export_templates.tpz" -d /tmp/tpl
          mv /tmp/tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/"
          godot --headless --version

      - name: Configure editor settings for Android export
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          godot --headless --editor --quit || true
          MINOR="$(echo "$GODOT_VERSION" | cut -d. -f1,2)"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$HOME/.android/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          cat > "$HOME/.config/godot/editor_settings-${MINOR}.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF

      - name: Prepare release keystore (only for release builds)
        if: ${{ inputs.build_type == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::release build requested but secret ANDROID_KEYSTORE_BASE64 is missing"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Export APK
        # Inputs are passed through env vars (never interpolated into the script) to avoid script injection.
        env:
          PROJECT_DIR: ${{ inputs.project_dir }}
          BUILD_TYPE: ${{ inputs.build_type }}
          PRESET: ${{ inputs.preset }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          cd "${PROJECT_DIR}"
          test -f project.godot
          test -f export_presets.cfg
          mkdir -p build/android
          godot --headless --import
          if [ "${BUILD_TYPE}" = "release" ]; then
            godot --headless --export-release "${PRESET}" "build/android/game-release.apk"
            test -s build/android/game-release.apk
          else
            godot --headless --export-debug "${PRESET}" "build/android/game-debug.apk"
            test -s build/android/game-debug.apk
          fi
          ls -la build/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ inputs.build_type }}
          path: ${{ inputs.project_dir }}/build/android/*.apk
          if-no-files-found: error
          retention-days: 30
